backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "vi"

collections:
  - name: "blog"
    label: "Bài viết / Tin tức"
    label_singular: "Bài viết"
    description: "Viết, sửa, xoá bài đăng trên trang Tin tức."
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: "HH:mm", format: "YYYY-MM-DD HH:mm" }
      - { label: "Ảnh bìa", name: "thumbnail", widget: "image", required: false }
      - { label: "Mô tả ngắn", name: "excerpt", widget: "text", required: false }
      - { label: "Nội dung", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Cài đặt chung (Logo & Liên hệ)"
    files:
      - name: "general"
        label: "Logo & Thông tin liên hệ"
        file: "content/settings.json"
        fields:
          - { label: "Logo (ảnh)", name: "logo", widget: "image", required: false, hint: "Tải logo mới; để trống nếu giữ logo hiện tại" }
          - { label: "Số điện thoại", name: "phone", widget: "string", default: "08.5687.0001" }
          - { label: "Email", name: "email", widget: "string", default: "hellochupanh@gmail.com" }
          - { label: "Facebook (đường dẫn)", name: "facebook", widget: "string", default: "https://www.facebook.com/hellochupanh/" }
          - { label: "Địa chỉ", name: "address", widget: "text", required: false, default: "371 Huỳnh Văn Bánh, Phường Phú Nhuận, TP.HCM" }
          - { label: "Giờ mở cửa", name: "hours", widget: "string", required: false, default: "9:00 – 21:00 hằng ngày" }

  - name: "homepage_images"
    label: "Ảnh trang chủ (Hero & Studio)"
    files:
      - name: "imgs"
        label: "Ảnh Hero & Ảnh khối Giới thiệu"
        file: "content/homepage_images.json"
        fields:
          - { label: "Ảnh nền đầu trang (Hero)", name: "hero", widget: "image", required: false, hint: "Ảnh lớn làm nền banner đầu trang chủ" }
          - { label: "Ảnh khối Giới thiệu (Chào bạn)", name: "intro", widget: "image", required: false, hint: "Ảnh ở khối 'Chào bạn! Chúng tớ là Hello'" }

  - name: "theme"
    label: "Giao diện (Màu & Phông)"
    files:
      - name: "theme"
        label: "Màu sắc & Phông chữ"
        file: "content/theme.json"
        fields:
          - { label: "Màu chính (nút, điểm nhấn)", name: "primary", widget: "color", default: "#F4A14F" }
          - { label: "Màu chính đậm (khi rê chuột)", name: "primary_dark", widget: "color", default: "#d9863a" }
          - { label: "Màu nền tối (header/footer)", name: "dark", widget: "color", default: "#1a1714" }
          - label: "Bộ phông chữ"
            name: "font"
            widget: "select"
            default: "classic"
            options:
              - { label: "Sang trọng (Playfair)", value: "classic" }
              - { label: "Hiện đại (Montserrat)", value: "modern" }
              - { label: "Thanh lịch (Cormorant)", value: "elegant" }

  - name: "homepage"
    label: "Sắp xếp trang chủ"
    files:
      - name: "sections"
        label: "Thứ tự & ẩn/hiện các khối"
        file: "content/sections.json"
        fields:
          - label: "Các khối (kéo để đổi thứ tự, tắt 'Hiển thị' để ẩn)"
            name: "order"
            widget: "list"
            fields:
              - label: "Khối"
                name: "key"
                widget: "select"
                options:
                  - { label: "Dải thống kê (5★...)", value: "stats" }
                  - { label: "Giới thiệu (Chào bạn!)", value: "intro" }
                  - { label: "Concept nổi bật", value: "concepts" }
                  - { label: "Vì sao chọn Hello", value: "why" }
                  - { label: "Kêu gọi liên hệ (cuối trang)", value: "cta" }
              - { label: "Hiển thị", name: "visible", widget: "boolean", default: true }
            default:
              - { key: "stats", visible: true }
              - { key: "intro", visible: true }
              - { key: "concepts", visible: true }
              - { key: "why", visible: true }
              - { key: "cta", visible: true }

  - name: "menu"
    label: "Menu (thanh điều hướng)"
    files:
      - name: "menu"
        label: "Các mục menu"
        file: "content/menu.json"
        fields:
          - label: "Các mục (kéo để đổi thứ tự)"
            name: "items"
            widget: "list"
            fields:
              - { label: "Tên hiển thị", name: "label", widget: "string" }
              - { label: "Đường dẫn", name: "url", widget: "string", hint: "vd: / hoặc /bang-gia/" }
              - { label: "Nút nổi bật (như 'Khách chọn ảnh')", name: "cta", widget: "boolean", default: false }
            default:
              - { label: "Trang chủ", url: "/", cta: false }
              - { label: "Dịch vụ", url: "/dich-vu/", cta: false }
              - { label: "Bảng giá", url: "/bang-gia/", cta: false }
              - { label: "Liên hệ", url: "/lien-he/", cta: false }
              - { label: "Tin tức", url: "/blog/", cta: false }
              - { label: "Khách chọn ảnh", url: "/khachhangchonanh/", cta: true }

  - name: "pricing"
    label: "Bảng giá"
    files:
      - name: "packages"
        label: "Các gói chụp"
        file: "content/pricing.json"
        fields:
          - label: "Các gói"
            name: "packages"
            widget: "list"
            fields:
              - { label: "Tên gói", name: "name", widget: "string" }
              - { label: "Giá hiện tại", name: "now", widget: "string" }
              - { label: "Giá gốc (gạch ngang)", name: "was", widget: "string", required: false }
              - { label: "Nhãn tiết kiệm", name: "save", widget: "string", required: false }
              - label: "Quyền lợi"
                name: "features"
                widget: "list"
                field: { label: "Dòng", name: "item", widget: "string" }
            default:
              - { name: "Chân dung Hoạ Báo Chất", now: "3.488.000đ", was: "4.488.000đ", save: "Tiết kiệm 1.000.000", features: [ {item: "1 layout makeup & 1 tóc theo concept"}, {item: "1 trang phục & phụ kiện theo concept"}, {item: "10 ảnh chỉnh sửa kỹ (file mềm)"}, {item: "Thời gian hậu kỳ 5 ngày"}, {item: "Ekip hỗ trợ tạo dáng xuyên suốt"}, {item: "Trả toàn bộ file gốc trong 24h"} ] }
              - { name: "Trắng Đen Cao Cấp", now: "3.288.000đ", was: "4.488.000đ", save: "Tiết kiệm 1.200.000", features: [ {item: "1 layout makeup & 1 tóc theo concept"}, {item: "1 trang phục & phụ kiện theo concept"}, {item: "10 ảnh chỉnh sửa kỹ (file mềm)"}, {item: "Thời gian hậu kỳ 5 ngày"}, {item: "Ekip hỗ trợ tạo dáng xuyên suốt"}, {item: "Trả toàn bộ file gốc trong 24h"} ] }
              - { name: "Beauty Hàn Quốc Tạp Chí", now: "3.288.000đ", was: "4.488.000đ", save: "Tiết kiệm 1.200.000", features: [ {item: "1 layout makeup & tóc theo concept"}, {item: "1 trang phục & phụ kiện theo concept"}, {item: "8 ảnh chỉnh sửa kỹ (file mềm)"}, {item: "Thời gian hậu kỳ 5 ngày"}, {item: "Ekip hỗ trợ tạo dáng xuyên suốt"}, {item: "Trả toàn bộ file gốc trong 24h"} ] }
