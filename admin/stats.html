<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Thống kê truy cập — Hello Chụp Ảnh</title>
<style>
  body{font-family:-apple-system,"Be Vietnam Pro",sans-serif;background:#faf7f2;color:#23201c;margin:0;padding:24px;}
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-family:"Playfair Display",Georgia,serif;font-size:26px;margin:0 0 4px;}
  .sub{color:#8a8175;font-size:14px;margin-bottom:22px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .stat{background:#fff;border:1.5px solid #ece6dc;border-radius:16px;padding:20px;text-align:center;}
  .stat .num{font-family:"Playfair Display",serif;font-size:32px;font-weight:800;color:#d9863a;}
  .stat .lbl{font-size:13px;color:#5a5349;margin-top:4px;}
  .row{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap;}
  .btn{background:#F4A14F;color:#fff;border:none;padding:10px 18px;border-radius:999px;font-weight:600;cursor:pointer;font-size:14px;}
  .btn.alt{background:#fff;color:#23201c;border:1.5px solid #ece6dc;}
  .msg{background:#fff;border:1.5px solid #ece6dc;border-radius:14px;padding:24px;text-align:center;color:#5a5349;}
  .links a{display:inline-block;margin-right:14px;color:#d9863a;font-weight:600;text-decoration:none;font-size:14px;}
  a.back{color:#8a8175;text-decoration:none;font-size:14px;}
  .err{background:#fff1f2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:14px;font-size:13px;}
</style>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="/admin/">← Về trang quản trị</a>
  <h1>Thống kê truy cập</h1>
  <div class="sub">Số liệu từ Microsoft Clarity — vài ngày gần nhất.</div>
  <div id="app"><div class="msg">Đang tải…</div></div>
  <div class="row links" style="margin-top:24px">
    <a href="https://clarity.microsoft.com/" target="_blank" rel="noopener">↗ Mở Clarity (bản đồ nhiệt, xem lại phiên)</a>
    <a href="https://analytics.google.com/" target="_blank" rel="noopener">↗ Mở Google Analytics</a>
  </div>
</div>
<script>
(function(){
  var I = window.netlifyIdentity, app = document.getElementById('app');
  function login(){ app.innerHTML = '<div class="msg">Vui lòng đăng nhập để xem số liệu.<br/><br/><button class="btn" id="lg">Đăng nhập</button></div>'; document.getElementById('lg').onclick=function(){ I.open(); }; }
  function num(v){ v = parseInt(v,10); return isNaN(v)? '–' : v.toLocaleString('vi-VN'); }
  function get(arr, metric, key){
    try{ var m=arr.find(function(x){return (x.metricName||x.metric||'')===metric;}); if(!m) return null; var info=(m.information||m.Information||[])[0]||{}; return info[key]; }catch(e){ return null; }
  }
  function render(data){
    if(data && data.error){ app.innerHTML='<div class="err">Không lấy được số liệu: '+data.error+'<br/><br/>Kiểm tra: đã tạo khóa Clarity và cài CLARITY_TOKEN trên Netlify chưa?</div>'; return; }
    var arr = Array.isArray(data)? data : (data.metrics||[]);
    var users=get(arr,'Traffic','distinctUserCount');
    var sessions=get(arr,'Traffic','totalSessionCount');
    var pps=get(arr,'Traffic','pagesPerSessionPercentage');
    if(users==null && sessions==null){
      app.innerHTML='<div class="msg">Đã kết nối nhưng chưa có số liệu (cần có người truy cập thật trong vài ngày). Dữ liệu thô:<br/><pre style="text-align:left;overflow:auto;font-size:11px">'+ (JSON.stringify(data,null,1)||'').slice(0,600) +'</pre></div>';
      return;
    }
    app.innerHTML='<div class="grid">'+
      '<div class="stat"><div class="num">'+num(users)+'</div><div class="lbl">Khách (3 ngày)</div></div>'+
      '<div class="stat"><div class="num">'+num(sessions)+'</div><div class="lbl">Lượt phiên</div></div>'+
      '<div class="stat"><div class="num">'+(pps!=null?Math.round(pps*10)/10:'–')+'</div><div class="lbl">Trang/phiên</div></div>'+
    '</div><div class="row"><button class="btn alt" onclick="location.reload()">↻ Tải lại</button></div>';
  }
  function load(user){
    app.innerHTML='<div class="msg">Đang tải số liệu…</div>';
    user.jwt().then(function(tok){
      return fetch('/.netlify/functions/clarity?days=3', { headers:{ Authorization:'Bearer '+tok } });
    }).then(function(r){ return r.json(); }).then(render).catch(function(e){ app.innerHTML='<div class="err">Lỗi tải: '+e+'</div>'; });
  }
  I.on('init', function(user){ if(user) load(user); else login(); });
  I.on('login', function(user){ load(user); });
  I.on('logout', function(){ login(); });
  I.init();
})();
</script>
</body>
</html>
